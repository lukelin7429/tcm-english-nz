<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic Kōrero</title>
<meta name="description" content="Everyday clinic English for a Chinese medicine practitioner in Aotearoa New Zealand.">
<meta name="theme-color" content="#1f5f5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Clinic Kōrero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <button class="brand" data-go="today" aria-label="Home">
    <span class="logo">針</span><span>Clinic Kōrero</span>
  </button>
  <div class="today-meter" id="meter" title="Minutes today"></div>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Main">
  <button data-go="today"><span class="ti">◐</span>Today</button>
  <button data-go="learn"><span class="ti">▤</span>Learn</button>
  <button data-go="review"><span class="ti">↻</span>Review<b id="dueBadge" hidden></b></button>
  <button data-go="glossary"><span class="ti">詞</span>Glossary</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
